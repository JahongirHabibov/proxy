services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
    networks:
      - socket-proxy-internal

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: legisell-proxy-ts
    # Explicit public upstream resolvers. Traefik shares this netns
    # (network_mode: service:tailscale) and inherits this DNS. Without it the
    # Docker embedded resolver (127.0.0.11) forwards to the host stub resolver
    # (127.0.0.53 systemd-resolved), unreachable from the container netns →
    # "server misbehaving" → ACME cannot resolve acme-v02.api.letsencrypt.org.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      # Public POS License API (api.legisell.de) — Traefik `poslicense` entrypoint.
      - target: 8443
        published: 8443
        protocol: tcp
        mode: host
    networks:
      - proxy-network
      - socket-proxy-internal
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.5
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - socket-proxy
      - tailscale
    network_mode: "service:tailscale"
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
      - TRAEFIK_PROVIDERS_DOCKER_NETWORK=${NETWORK_NAME:-proxy-network}
    command:
      - "--configfile=/traefik.yml"
    volumes:
      - ./traefik/traefik.yml:/traefik.yml:ro
      # The file provider watches exactly ONE directory, and two projects need to
      # put files in it: this one (middlewares, TLS options) and the customer
      # website stack (one router per customer site). So that directory IS the
      # shared `traefik-dynamic` volume — read-only here, writable in the website
      # api — and this project's own config is overlaid as a single file inside
      # it. Docker applies nested mounts by target depth, so dynamic.yml wins
      # inside the volume mount and is never written into the volume.
      #
      # No host path and no chown ritual: the volume is created by `make setup`
      # here or by `make install` in the website repo, whichever runs first.
      #
      # The volume is mounted read-WRITE on purpose: runc cannot create the
      # mountpoint for the nested dynamic.yml inside a read-only mount. Traefik
      # never writes here. `make setup`/`make up` also copy dynamic.yml *into*
      # the volume, so if this stack is ever started without the bind below,
      # Traefik reads the last synced middleware definitions instead of an empty
      # file — which would drop security-headers@file and break every router
      # referencing it.
      - traefik-dynamic:/config
      - ./traefik/config/dynamic.yml:/config/dynamic.yml:ro
      - ./traefik/acme.json:/acme.json
    labels:
      - "traefik.enable=true"
      # Dashboard router — secured with BasicAuth
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      # ts-only@file gates the dashboard to the Tailscale CGNAT range — it is no
      # longer reachable from the public internet. BasicAuth stays as a second
      # factor. Reach it from a tailnet device (see NOTE on proxy DNS below).
      - "traefik.http.routers.traefik-dashboard.middlewares=ts-only@file,traefik-auth,security-headers@file,rate-limit-strict@file"
      # BasicAuth middleware — credentials set via DASHBOARD_USERS in .env
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${DASHBOARD_USERS}"
      # Dummy port to satisfy the Docker provider's validation since ports are on the sidecar
      - "traefik.http.services.traefik-proxy.loadbalancer.server.port=8080"

networks:
  proxy-network:
    name: ${NETWORK_NAME:-proxy-network}
    driver: bridge
  socket-proxy-internal:
    internal: true

volumes:
  tailscale-state:
    name: tailscale-state
  # Shared with the customer website stack (retail-website-template), which
  # writes one router file per customer site into it. Declared external in BOTH
  # projects so neither owns the other's lifecycle — `make setup` creates it.
  traefik-dynamic:
    external: true
    name: traefik-dynamic
