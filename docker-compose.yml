services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
    networks:
      - socket-proxy-internal

  # The tailnet node. It is NOT a sidecar any more (2026-07-31) — that shape is
  # what broke, and the fix was to separate the two, not to drop the tailnet.
  #
  # What went wrong before: Traefik ran with `network_mode: "service:tailscale"`,
  # so it had no network namespace of its own and borrowed this container's. A
  # namespace belongs to the container that created it, so every time this one was
  # recreated, Traefik was left in an orphaned namespace: no DNS (`lookup
  # socket-proxy on 127.0.0.11:53: connection refused`), no route to the Docker
  # bridge (`dial 172.20.0.9:8000: network is unreachable`). Traefik kept running
  # and every site behind it went dark — the worst shape a failure can take,
  # because it looks like a routing bug in the apps. It happened twice in one day
  # while the node key was expired and this container re-registered in a loop.
  #
  # `network_mode: host` removes the coupling completely. tailscaled configures
  # the host's own `tailscale0` interface; Traefik keeps its own namespace and
  # publishes 80/443/8443 with `mode: host`, i.e. on every host interface —
  # including tailscale0. A tailnet client therefore reaches Traefik with its
  # 100.64.0.0/10 source address intact, which is exactly what the allowlists
  # below and in legisell-deployment match on. Restarting this container now
  # affects nothing but the tailnet.
  #
  # What the tailnet gates on THIS host — two things, not one:
  #   * the Traefik dashboard, if `ts-only@file` is put back on its router
  #   * admin.legisell.de and api.legisell.de, via `legisell-ts-only`
  #     (ipAllowList 100.64.0.0/10, defined in
  #     external_repos/legisell-deployment/docker-compose.yml)
  # Removing this node takes those off the air with no error naming the cause.
  # An earlier version of this comment claimed it was "exactly one thing, the
  # dashboard" — that was wrong, and acting on it cost an outage on 2026-07-31.
  #
  # NOT gated by the tailnet, and deliberately so: the SaaS↔LEGISELL channels and
  # the customer websites. Those are public HTTPS with HMAC by design.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: legisell-proxy-ts
    restart: unless-stopped
    # No `networks:` key — host mode owns the host's stack and the two are
    # mutually exclusive. This container publishes nothing; it only adds an
    # interface. That is why it cannot collide with Traefik over port 80 again.
    network_mode: host
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      # Kernel networking, not userspace: userspace mode would need a proxy for
      # every inbound connection, and the whole point here is that tailnet
      # traffic reaches the host's ports directly.
      - TS_USERSPACE=false
      # Do NOT let tailscaled take over the host resolver. With MagicDNS on, it
      # rewrites /etc/resolv.conf on the host — which every other container
      # inherits. The node is here for one allowlist, so it has no business
      # touching name resolution for the rest of the estate.
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      # The node identity. Reused on purpose: same key, same tailnet IP, so
      # `TAILSCALE_LOCAL_IP` in legisell-deployment stays valid and the tailnet
      # does not collect a second, stale device.
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # An expired node key is what started the 2026-07-30 incident, and nothing
    # made it visible: the container stayed "Up" while re-registering in a loop.
    # `tailscale status` fails in that state, so `docker ps` now shows it.
    # Prevent the state instead of watching for it: switch the node to
    # "Disable key expiry" in the Tailscale admin console.
    healthcheck:
      test: ["CMD-SHELL", "tailscale status >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  traefik:
    image: traefik:v3.7.5
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - socket-proxy
    # Its own namespace. This is the whole point of the change above.
    networks:
      - proxy-network
      - socket-proxy-internal
    # These ports were published on the tailscale sidecar and must live here now,
    # or nothing listens on 80/443 at all.
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      # Public POS License API (api.legisell.de) — Traefik `poslicense` entrypoint.
      - target: 8443
        published: 8443
        protocol: tcp
        mode: host
    # Carried over from the removed sidecar, and load bearing: the Docker embedded
    # resolver (127.0.0.11) forwards to the host stub resolver (127.0.0.53
    # systemd-resolved), which is unreachable from a container namespace →
    # "server misbehaving" → ACME cannot resolve acme-v02.api.letsencrypt.org and
    # no certificate ever renews.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
      - TRAEFIK_PROVIDERS_DOCKER_NETWORK=${NETWORK_NAME:-proxy-network}
    command:
      - "--configfile=/traefik.yml"
    volumes:
      - ./traefik/traefik.yml:/traefik.yml:ro
      # The file provider watches exactly ONE directory, and two projects need to
      # put files in it: this one (middlewares, TLS options) and the customer
      # website stack (one router per customer site). So that directory IS the
      # shared `traefik-dynamic` volume — read-only here, writable in the website
      # api — and this project's own config is overlaid as a single file inside
      # it. Docker applies nested mounts by target depth, so dynamic.yml wins
      # inside the volume mount and is never written into the volume.
      #
      # No host path and no chown ritual: the volume is created by `make setup`
      # here or by `make install` in the website repo, whichever runs first.
      #
      # The volume is mounted read-WRITE on purpose: runc cannot create the
      # mountpoint for the nested dynamic.yml inside a read-only mount. Traefik
      # never writes here. `make setup`/`make up` also copy dynamic.yml *into*
      # the volume, so if this stack is ever started without the bind below,
      # Traefik reads the last synced middleware definitions instead of an empty
      # file — which would drop security-headers@file and break every router
      # referencing it.
      - traefik-dynamic:/config
      - ./traefik/config/dynamic.yml:/config/dynamic.yml:ro
      - ./traefik/acme.json:/acme.json
    labels:
      - "traefik.enable=true"
      # ── Dashboard router: public, guarded by BasicAuth ────────────────────
      # The tailnet gate (`ts-only@file`, ipAllowList 100.64.0.0/10) is NOT on
      # this router — deliberate operator decision (2026-07-30, reaffirmed
      # 2026-07-31): the dashboard should be reachable from anywhere. The node
      # is back and the middleware works again, so this is a choice, not a
      # leftover; append `ts-only@file` below to reverse it.
      #
      # What that means, so nobody has to rediscover it: BasicAuth is now the only
      # thing between the internet and a page that lists every router, service and
      # backend address on this host. It does not expose the Docker socket and it
      # cannot change anything (the API is read-only here), but it is a map of the
      # estate. The password is therefore the whole defence — keep it long, and
      # rotate it if it was ever typed into a shared machine.
      #
      # rate-limit-strict@file stays in front of it: it is what makes guessing the
      # password expensive rather than free.
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth,security-headers@file,rate-limit-strict@file"
      # BasicAuth middleware — credentials set via DASHBOARD_USERS in .env
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${DASHBOARD_USERS}"
      # Dummy port to satisfy the Docker provider's validation.
      - "traefik.http.services.traefik-proxy.loadbalancer.server.port=8080"

networks:
  proxy-network:
    name: ${NETWORK_NAME:-proxy-network}
    driver: bridge
  socket-proxy-internal:
    internal: true

volumes:
  # The tailnet node identity. Deleting it turns "recreate the container" into
  # "re-authenticate the node, get a new IP, update TAILSCALE_LOCAL_IP in
  # legisell-deployment and clean up a stale device in the admin console".
  # `docker compose down` does not remove named volumes without -v — keep it
  # that way.
  tailscale-state:
    name: tailscale-state
  # Shared with the customer website stack (retail-website-template), which
  # writes one router file per customer site into it. Declared external in BOTH
  # projects so neither owns the other's lifecycle — `make setup` creates it.
  traefik-dynamic:
    external: true
    name: traefik-dynamic
