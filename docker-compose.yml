services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
    networks:
      - socket-proxy-internal

# ── The tailnet node is NOT here, and must not be put here ───────────────────
#
# `tailscaled` runs on the host, managed by systemd (installed from the Tailscale
# apt repo, `systemctl status tailscaled`). It owns /dev/net/tun and therefore
# `tailscale0`. A container — sidecar or `network_mode: host` — cannot take that
# device from it: the second daemon dies with `TUN device tailscale0 is busy`,
# restarts, and dies again. Both shapes were tried on this host; both failed for
# that reason. If you are about to add a tailscale service below, stop and run
# `tailscale status` on the host first.
#
# The history, so the sidecar is not reinvented either: Traefik used to run with
# `network_mode: "service:tailscale"`, borrowing the sidecar's network namespace.
# A namespace belongs to the container that created it, so every recreation of
# the sidecar left Traefik in an orphaned one — no DNS (`lookup socket-proxy on
# 127.0.0.11:53: connection refused`), no route to the Docker bridge — while
# Traefik kept running and every site behind it went dark. Traefik now owns its
# namespace and publishes 80/443/8443 with `mode: host`, i.e. on every host
# interface including tailscale0.
#
# MEASURED CONSEQUENCE, 2026-08-01 — do not assume otherwise: traffic arriving on
# tailscale0 reaches Traefik with its source address rewritten to the bridge
# gateway (172.20.0.1), while traffic on the public interface keeps its real
# client address. An earlier version of this comment claimed the tailnet source
# survived; it does not. The sidecar had tailscale0 *inside* Traefik's own
# namespace with no NAT in between, which is why `legisell-ts-only` worked then
# and returns 403 to every tailnet client now. The gate depended on the sidecar
# shape, not merely on the node existing — see the note on that middleware in
# external_repos/legisell-deployment before changing it.
#
# What the tailnet gates on THIS host — one thing today, and it is not the one
# the old comment named:
#   * admin.legisell.de — BOTH its routers, `legisell-admin` (by hostname) and
#     `legisell-admin-ip` (by Host(TAILSCALE_LOCAL_IP)), via `legisell-ts-only`
#     (ipAllowList 100.64.0.0/10, in
#     external_repos/legisell-deployment/docker-compose.yml). api.legisell.de is
#     NOT gated — it is the public POS licence API on the `poslicense`
#     entrypoint, carrying rate-limit@file only.
#   * the Traefik dashboard would be too, if `ts-only@file` were on its router.
#     It is not — see the comment there.
# A logged-out host node takes admin.legisell.de off the air, and the only
# symptom is a 403 that looks like a working allowlist. `make up` warns about it for that reason.
# An earlier comment here claimed the tailnet gated "exactly one thing, the
# dashboard" — that was wrong, and acting on it cost an outage on 2026-07-31.
#
# NOT gated by the tailnet, deliberately: the SaaS<->LEGISELL channels and the
# customer websites. Those are public HTTPS with HMAC by design.
#
# Operating the node (on the host, not in a container):
#     tailscale status
#     tailscale up --accept-dns=false      # --accept-dns=false so tailscaled does
#                                          # not rewrite the host resolver that
#                                          # every container inherits
# and switch the node to "Disable key expiry" in the admin console — an expired
# key is what started the 2026-07-30 incident.

  traefik:
    image: traefik:v3.7.5
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - socket-proxy
    # Its own namespace. This is the whole point of the change above.
    networks:
      - proxy-network
      - socket-proxy-internal
    # These ports were published on the tailscale sidecar and must live here now,
    # or nothing listens on 80/443 at all.
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      # Public POS License API (api.legisell.de) — Traefik `poslicense` entrypoint.
      - target: 8443
        published: 8443
        protocol: tcp
        mode: host
    # Carried over from the removed sidecar, and load bearing: the Docker embedded
    # resolver (127.0.0.11) forwards to the host stub resolver (127.0.0.53
    # systemd-resolved), which is unreachable from a container namespace →
    # "server misbehaving" → ACME cannot resolve acme-v02.api.letsencrypt.org and
    # no certificate ever renews.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
      - TRAEFIK_PROVIDERS_DOCKER_NETWORK=${NETWORK_NAME:-proxy-network}
    command:
      - "--configfile=/traefik.yml"
    volumes:
      - ./traefik/traefik.yml:/traefik.yml:ro
      # The file provider watches exactly ONE directory, and two projects need to
      # put files in it: this one (middlewares, TLS options) and the customer
      # website stack (one router per customer site). So that directory IS the
      # shared `traefik-dynamic` volume — read-only here, writable in the website
      # api — and this project's own config is overlaid as a single file inside
      # it. Docker applies nested mounts by target depth, so dynamic.yml wins
      # inside the volume mount and is never written into the volume.
      #
      # No host path and no chown ritual: the volume is created by `make setup`
      # here or by `make install` in the website repo, whichever runs first.
      #
      # The volume is mounted read-WRITE on purpose: runc cannot create the
      # mountpoint for the nested dynamic.yml inside a read-only mount. Traefik
      # never writes here. `make setup`/`make up` also copy dynamic.yml *into*
      # the volume, so if this stack is ever started without the bind below,
      # Traefik reads the last synced middleware definitions instead of an empty
      # file — which would drop security-headers@file and break every router
      # referencing it.
      - traefik-dynamic:/config
      - ./traefik/config/dynamic.yml:/config/dynamic.yml:ro
      - ./traefik/acme.json:/acme.json
    labels:
      - "traefik.enable=true"
      # ── Dashboard router: public, guarded by BasicAuth ────────────────────
      # The tailnet gate (`ts-only@file`, ipAllowList 100.64.0.0/10) is NOT on
      # this router — deliberate operator decision (2026-07-30, reaffirmed
      # 2026-07-31): the dashboard should be reachable from anywhere. The
      # middleware still exists and works whenever the host node is logged in, so
      # this is a choice, not a leftover; append `ts-only@file` to reverse it.
      #
      # What that means, so nobody has to rediscover it: BasicAuth is now the only
      # thing between the internet and a page that lists every router, service and
      # backend address on this host. It does not expose the Docker socket and it
      # cannot change anything (the API is read-only here), but it is a map of the
      # estate. The password is therefore the whole defence — keep it long, and
      # rotate it if it was ever typed into a shared machine.
      #
      # rate-limit-strict@file stays in front of it: it is what makes guessing the
      # password expensive rather than free.
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth,security-headers@file,rate-limit-strict@file"
      # BasicAuth middleware — credentials set via DASHBOARD_USERS in .env
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${DASHBOARD_USERS}"
      # Dummy port to satisfy the Docker provider's validation.
      - "traefik.http.services.traefik-proxy.loadbalancer.server.port=8080"

networks:
  proxy-network:
    name: ${NETWORK_NAME:-proxy-network}
    driver: bridge
  socket-proxy-internal:
    internal: true

volumes:
  # No `tailscale-state` here any more: the node lives on the host and keeps its
  # identity in /var/lib/tailscale. The old volume of the same name still exists
  # on disk and holds the retired sidecar node's key — unreferenced, harmless,
  # and safe to `docker volume rm tailscale-state` once the host node is
  # confirmed logged in. Its device should also be deleted in the admin console,
  # or the tailnet keeps a machine that nothing runs.

  # Shared with the customer website stack (retail-website-template), which
  # writes one router file per customer site into it. Declared external in BOTH
  # projects so neither owns the other's lifecycle — `make setup` creates it.
  traefik-dynamic:
    external: true
    name: traefik-dynamic
