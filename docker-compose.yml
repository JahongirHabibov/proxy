services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
    networks:
      - socket-proxy-internal

# The tailscale sidecar is gone (2026-07-30). It was removed because of what it
# did to Traefik, not because of anything it did itself.
#
# Traefik used `network_mode: "service:tailscale"`, i.e. it had no network
# namespace of its own and borrowed tailscale's. A namespace belongs to the
# container that created it, so every time the tailscale container was recreated
# or restarted, Traefik was left in an orphaned namespace: no DNS
# (`lookup socket-proxy on 127.0.0.11:53: connection refused`), no route to the
# Docker bridge (`dial 172.20.0.9:8000: network is unreachable`). Traefik keeps
# running and every site behind it goes dark, which is the worst possible shape
# for a failure — it looks like a routing problem in the apps.
#
# It happened twice in one day because the tailscale node key had expired and the
# container was in a re-registration loop (RestartCount=8, "To authenticate,
# visit ..."), so it recreated its namespace every few minutes.
#
# What it was actually used for on THIS host: exactly one thing, gating the
# Traefik dashboard to the tailnet (`ts-only@file`). Not the SaaS↔LEGISELL
# channels — those are public HTTPS with HMAC by design — and not any other
# service here. That is a bad trade for a whole-proxy failure mode.
#
# To bring it back: restore docker-compose.yml.bak-20260730-1320, and authenticate
# the node (`docker exec tailscale tailscale up`) BEFORE relying on it. The
# tailscale-state volume was left in place.

  traefik:
    image: traefik:v3.7.5
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - socket-proxy
    # Its own namespace. This is the whole point of the change above.
    networks:
      - proxy-network
      - socket-proxy-internal
    # These ports were published on the tailscale sidecar and must live here now,
    # or nothing listens on 80/443 at all.
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      # Public POS License API (api.legisell.de) — Traefik `poslicense` entrypoint.
      - target: 8443
        published: 8443
        protocol: tcp
        mode: host
    # Carried over from the removed sidecar, and load bearing: the Docker embedded
    # resolver (127.0.0.11) forwards to the host stub resolver (127.0.0.53
    # systemd-resolved), which is unreachable from a container namespace →
    # "server misbehaving" → ACME cannot resolve acme-v02.api.letsencrypt.org and
    # no certificate ever renews.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
      - TRAEFIK_PROVIDERS_DOCKER_NETWORK=${NETWORK_NAME:-proxy-network}
    command:
      - "--configfile=/traefik.yml"
    volumes:
      - ./traefik/traefik.yml:/traefik.yml:ro
      # The file provider watches exactly ONE directory, and two projects need to
      # put files in it: this one (middlewares, TLS options) and the customer
      # website stack (one router per customer site). So that directory IS the
      # shared `traefik-dynamic` volume — read-only here, writable in the website
      # api — and this project's own config is overlaid as a single file inside
      # it. Docker applies nested mounts by target depth, so dynamic.yml wins
      # inside the volume mount and is never written into the volume.
      #
      # No host path and no chown ritual: the volume is created by `make setup`
      # here or by `make install` in the website repo, whichever runs first.
      #
      # The volume is mounted read-WRITE on purpose: runc cannot create the
      # mountpoint for the nested dynamic.yml inside a read-only mount. Traefik
      # never writes here. `make setup`/`make up` also copy dynamic.yml *into*
      # the volume, so if this stack is ever started without the bind below,
      # Traefik reads the last synced middleware definitions instead of an empty
      # file — which would drop security-headers@file and break every router
      # referencing it.
      - traefik-dynamic:/config
      - ./traefik/config/dynamic.yml:/config/dynamic.yml:ro
      - ./traefik/acme.json:/acme.json
    labels:
      - "traefik.enable=true"
      # ── Dashboard router: public, guarded by BasicAuth ────────────────────
      # The tailnet gate (`ts-only@file`, ipAllowList 100.64.0.0/10) is gone with
      # tailscale and is NOT replaced by an IP allowlist — deliberate operator
      # decision (2026-07-30): the dashboard should be reachable from anywhere.
      #
      # What that means, so nobody has to rediscover it: BasicAuth is now the only
      # thing between the internet and a page that lists every router, service and
      # backend address on this host. It does not expose the Docker socket and it
      # cannot change anything (the API is read-only here), but it is a map of the
      # estate. The password is therefore the whole defence — keep it long, and
      # rotate it if it was ever typed into a shared machine.
      #
      # rate-limit-strict@file stays in front of it: it is what makes guessing the
      # password expensive rather than free.
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth,security-headers@file,rate-limit-strict@file"
      # BasicAuth middleware — credentials set via DASHBOARD_USERS in .env
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${DASHBOARD_USERS}"
      # Dummy port to satisfy the Docker provider's validation.
      - "traefik.http.services.traefik-proxy.loadbalancer.server.port=8080"

networks:
  proxy-network:
    name: ${NETWORK_NAME:-proxy-network}
    driver: bridge
  socket-proxy-internal:
    internal: true

volumes:
  # Kept although no service uses it any more: it holds the tailnet node identity,
  # and deleting it would turn "restore the backup file" into "re-authenticate the
  # node". `docker compose down` does not remove named volumes without -v.
  tailscale-state:
    name: tailscale-state
  # Shared with the customer website stack (retail-website-template), which
  # writes one router file per customer site into it. Declared external in BOTH
  # projects so neither owns the other's lifecycle — `make setup` creates it.
  traefik-dynamic:
    external: true
    name: traefik-dynamic
