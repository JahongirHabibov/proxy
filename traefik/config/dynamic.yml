http:
  middlewares:
    # Tailscale-only IP allowlist (CGNAT range). Reusable across routers that
    # must never be reachable from the public internet (admin panel, dashboard).
    # Usage: traefik.http.routers.myapp.middlewares=ts-only@file
    ts-only:
      ipAllowList:
        sourceRange:
          - "100.64.0.0/10"

    # www → non-www permanent redirect (301)
    # Usage in app labels: traefik.http.routers.myapp-www.middlewares=www-redirect@file
    www-redirect:
      redirectRegex:
        regex: "^https://www\\.(.+)"
        replacement: "https://${1}"
        permanent: true

    # Security headers applied to all production HTTPS routers
    # Usage in app labels: traefik.http.routers.myapp.middlewares=security-headers@file
    security-headers:
      headers:
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"

    # gzip + brotli compression for text responses (replaces nginx gzip)
    # Usage in app labels: traefik.http.routers.myapp.middlewares=compress@file
    compress:
      compress:
        includedContentTypes:
          - text/html
          - text/css
          - text/javascript
          - application/javascript
          - application/json
          - application/xml
          - image/svg+xml

    # General rate limit for public-facing services
    # 100 req/s avg, burst up to 200 — protects against light DoS
    # Usage: traefik.http.routers.myapp.middlewares=rate-limit@file
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Strict rate limit for auth/admin endpoints (dashboard, login pages)
    # 20 req/s avg, burst 30 — prevents brute-force
    # Usage: traefik.http.routers.myapp.middlewares=rate-limit-strict@file
    rate-limit-strict:
      rateLimit:
        average: 20
        burst: 30
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

  # Scoped backend transport for the internal Traefik→nginx hop only.
  # nginx serves a long-lived self-signed cert on 443/8443; skip verification
  # for THIS hop without weakening verification globally.
  # Usage: traefik.http.services.X.loadbalancer.serverstransport=legisell-internal@file
  serversTransports:
    legisell-internal:
      insecureSkipVerify: true

# Default TLS policy applied to every router without explicit tls.options.
# Enforces a modern floor (TLS 1.2+) instead of relying on build defaults.
tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
