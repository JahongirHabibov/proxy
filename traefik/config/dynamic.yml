http:
  middlewares:
    # Tailscale-only IP allowlist (CGNAT range). Reusable across routers that
    # must never be reachable from the public internet (admin panel, dashboard).
    # Usage: traefik.http.routers.myapp.middlewares=ts-only@file
    ts-only:
      ipAllowList:
        sourceRange:
          - "100.64.0.0/10"

    # www → non-www permanent redirect (301)
    # Usage in app labels: traefik.http.routers.myapp-www.middlewares=www-redirect@file
    www-redirect:
      redirectRegex:
        regex: "^https://www\\.(.+)"
        replacement: "https://${1}"
        permanent: true

    # Security headers applied to all production HTTPS routers
    # Usage in app labels: traefik.http.routers.myapp.middlewares=security-headers@file
    security-headers:
      headers:
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"

    # gzip + brotli compression for text responses (replaces nginx gzip)
    # Usage in app labels: traefik.http.routers.myapp.middlewares=compress@file
    compress:
      compress:
        includedContentTypes:
          - text/html
          - text/css
          - text/javascript
          - application/javascript
          - application/json
          - application/xml
          - image/svg+xml

    # Neither limit sets `sourceCriterion`, and that is the fix, not an omission.
    #
    # Both used to carry `ipStrategy: {depth: 1}`, which reads the client address
    # out of X-Forwarded-For. Traefik is the edge here, so a normal browser
    # request carries no such header — and `depth: 1` against a header that is not
    # there yields an EMPTY key. Every visitor of a site was therefore counted
    # into one shared bucket: 100 req/s for the whole world, not per client. One
    # crawler throttled every real user of that site, and a page with twenty
    # assets needed only five simultaneous visitors to hit the ceiling.
    #
    # Measured on 2026-08-01 with a local Traefik v3.7.5, two client IPs, limit
    # 2/s, 20 requests each:
    #     depth: 1              → client A 0 allowed, client B 2   (one bucket)
    #     no sourceCriterion    → client A 2 allowed, client B 2   (per client)
    #
    # The same test also refutes the reason first given for this change: forging
    # X-Forwarded-For does NOT bypass `depth: 1`. Traefik does not trust inbound
    # forwarded headers unless an entrypoint declares `forwardedHeaders.trustedIPs`,
    # and none here does, so it overwrites them with the real peer address. The
    # old setting was not a security hole; it was an availability one.
    #
    # Without the key Traefik uses the real remote address. Reintroduce a depth
    # ONLY if a real proxy is ever put in front of this one, declare its address
    # in `forwardedHeaders.trustedIPs` at the same time, and count from the right:
    # depth = the number of hops you control.

    # General rate limit for public-facing services
    # 100 req/s avg, burst up to 200 — protects against light DoS
    # Usage: traefik.http.routers.myapp.middlewares=rate-limit@file
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

    # Strict rate limit for auth/admin endpoints (dashboard, login pages)
    # 20 req/s avg, burst 30 — prevents brute-force
    # Usage: traefik.http.routers.myapp.middlewares=rate-limit-strict@file
    rate-limit-strict:
      rateLimit:
        average: 20
        burst: 30
        period: 1s

  # Scoped backend transport for the internal Traefik→nginx hop only.
  # nginx serves a long-lived self-signed cert on 443/8443; skip verification
  # for THIS hop without weakening verification globally.
  # Usage: traefik.http.services.X.loadbalancer.serverstransport=legisell-internal@file
  serversTransports:
    legisell-internal:
      insecureSkipVerify: true

# Default TLS policy applied to every router without explicit tls.options.
# Enforces a modern floor (TLS 1.2+) instead of relying on build defaults.
tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
